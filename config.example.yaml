# Ports published by Ops-Aero/opsaero-main after ./install.sh:
#   FSD protocol      127.0.0.1:6809
#   openfsd admin API 127.0.0.1:8010   ← JWT mint lives here
#   Laravel website   127.0.0.1:8000   ← do not use this as api_base
#
# This file contains NO credentials and no working defaults. Supply your own
# via the environment (OPENFSD_CID / OPENFSD_PASSWORD, or OPENFSD_TOKEN — see
# .env.example) or via a config.yaml you keep out of git.
#
# Use a dedicated ATIS identity (OPENFSD_CID / OPENFSD_PASSWORD) with the
# lowest network rating your stations need — S2 (3) for tower ATIS, at most
# C1 (5). Do not use CID 1 or the bootstrap Administrator account.

server:
  host: 127.0.0.1
  port: 6809
  # Optional. When set, POST {api_base}/api/v1/fsd-jwt immediately before #AA.
  # Leave empty to send the CID password as the FSD token — openFSD accepts that.
  api_base: http://127.0.0.1:8010

auth:
  # Required: CID of a dedicated ATIS/injector account you created.
  # Never CID 1 (typical bootstrap admin). Startup fails if this is not a
  # positive integer.
  cid: 0
  # Required: your own password (or set token / OPENFSD_PASSWORD instead).
  # There is no built-in default — startup fails when both are empty.
  password: ""
  # Optional pre-minted JWT. If set, api_base is not called.
  token: ""
  real_name: "ATIS Bot"
  # Must not exceed the rating stored on your CID, and must not be
  # Administrator (12) unless allow_administrator is set.
  # 1=OBS 2=S1 3=S2 4=S3 5=C1 6=C2 7=C3 8=I1 9=I2 10=I3 11=SUP 12=ADM
  # Tower ATIS (facility_type 4) needs at least S2 (3); stay at or below C1 (5).
  rating: 3
  # allow_administrator: false
  protocol_revision: 100
  # Harmless client identifier shown in $ID. Not a VATSIM whitelist on openFSD.
  client_id: "0f5d"
  client_name: "openfsd-injector"
  client_major: 0
  client_minor: 1

injector:
  reconnect_seconds: 5
  position_interval_seconds: 5

plugins:
  atis:
    enabled: true
    # How often to rebuild text ATIS from METAR.
    refresh_seconds: 3600
    metar_url: "https://aviationweather.gov/api/data/metar?ids={icao}&format=raw"
    # Max $CQ ATIS replies served to one requester per window.
    reply_rate_limit: 6
    reply_rate_window_seconds: 60
    # TTS writes looping WAV/OGG under audio/cache/{icao}.wav and refreshes
    # only when the information letter changes. This process also serves those
    # files over HTTP for opsaero-main / a radio client:
    #   http://injector:8091/atis/index.json
    # When SRS_HOST is set, the same WAVs are also looped onto each station's
    # COM via ciribob SRS 2.x (not AFV). Empty SRS_HOST = HTTP only.
    #
    # Omit backend/enabled to default: tts in Docker (or VOICE_BACKEND=tts),
    # none on the host. An explicit backend here overrides that default.
    voice:
      engine: auto           # auto (edge-tts, then piper) | edge-tts | piper
      voice: en-GB-SoniaNeural
      piper_model: ""        # required only when engine is piper
      # scrape_url is ignored. Do not point this at LiveATC.
      scrape_url: ""
      cache_dir: audio/cache
    # First-party audio index. Bind 0.0.0.0 in Docker; compose does not
    # publish the port. Host publish is opt-in (AUDIO_HTTP_PUBLISH=1).
    audio_http:
      enabled: true
      port: 8091
      # srs_host: ""         # empty = off. opsaero-main: SRS_HOST=srs
      # srs_port: 5002
      # srs_tx: true         # false / SRS_TX=0 = TCP radios only, HTTP remains
      # srs_name: OPSAERO_ATIS
      # srs_coalition: 0     # spectator. Do not put EAM passwords in yaml.
    # Empty = build from ATIS_ICAOS (see .env.example majors list). An
    # explicit list here overrides the environment.
    stations: []
    # stations:
    #   - icao: EGLL
    #     name: "Heathrow Information"
    #     callsign: EGLL_ATIS
    #     frequency: 128.080
    #     lat: 51.4775
    #     lon: -0.4614
    #     vis_range_nm: 60
    #     facility_type: 4     # Tower — allowed for rating >= S2 on openFSD
    #     runways_dep: "27L, 27R"
    #     runways_arr: "27L, 27R"
    #     approach: "ILS"
    #     extra_lines:
    #       - "SIMULTANEOUS DEPARTURES IN PROGRESS"

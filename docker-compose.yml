# Run beside Ops-Aero/opsaero-main on the same host.
# opsaero-main publishes FSD :6809 and openfsd admin :8010 on the host.
#
#   cp config.example.yaml config.yaml
#   cp .env.example .env
#   docker compose up --build
#
# To join the OpsAero compose network instead of host ports, set:
#   OPENFSD_HOST=fsd
#   OPENFSD_API_BASE=http://fsdweb:8010
# and add:
#   networks: { default: { external: true, name: opsaero_default } }

services:
  injector:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OPENFSD_HOST: ${OPENFSD_HOST:-host.docker.internal}
      OPENFSD_PORT: ${OPENFSD_PORT:-6809}
      OPENFSD_API_BASE: ${OPENFSD_API_BASE:-http://host.docker.internal:8010}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./audio:/app/audio
    extra_hosts:
      - "host.docker.internal:host-gateway"

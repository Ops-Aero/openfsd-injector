# Same host as opsaero-main (FSD :6809, openfsd API :8010 on the host).
#
#   git clone https://github.com/Ops-Aero/openfsd-injector
#   cd openfsd-injector
#   cp .env.example .env      # then edit .env with your own credentials
#   docker compose up -d --build
#
# After the image is on GHCR:
#   docker compose pull
#   docker compose up -d
#
# This repo ships no credentials. `.env` is git-ignored and you must create it:
# compose refuses to start without it, and the injector exits with a clear
# error if no credential is configured.
#
# Optional: copy config.example.yaml → config.yaml, edit stations, and set
# OPENFSD_CONFIG=./config.yaml.

name: opsaero-injector

services:
  injector:
    image: ghcr.io/jaycommit/openfsd-injector:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${OPENFSD_CONFIG:-./config.example.yaml}:/app/config.yaml:ro
      - ./audio:/app/audio
    extra_hosts:
      - "host.docker.internal:host-gateway"

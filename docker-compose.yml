# Sidecar next to opsaero-main. This repo ships no credentials and does
# not use docker.env. Copy .env.example → .env, set OPENFSD_CID /
# OPENFSD_PASSWORD (dedicated ATIS user, not CID 1). No password → the
# injector exits. Rating 12 → exits unless OPENFSD_ALLOW_ADMINISTRATOR=1.
#
#   git clone https://github.com/Ops-Aero/openfsd-injector
#   cd openfsd-injector
#   cp .env.example .env      # then edit CID + password
#   docker compose up -d --build
#
# Default: extra_hosts → host-published FSD :6809 and API :8010
# (OPENFSD_HOST=host.docker.internal).
#
# Host network (Linux, FSD on the host loopback) — comment extra_hosts
# and uncomment:
#     network_mode: host
# then OPENFSD_HOST=127.0.0.1 and OPENFSD_API_BASE=http://127.0.0.1:8010
#
# Join opsaero-main's compose network (service names fsd / fsdweb):
#   networks:
#     default:
#       name: opsaero
#       external: true
# then OPENFSD_HOST=fsd and OPENFSD_API_BASE=http://fsdweb:8010
#
# Stations: ATIS_ICAOS in .env (majors list in .env.example), or copy
# config.example.yaml → config.yaml and set OPENFSD_CONFIG=./config.yaml.
# Voice defaults to tts in Docker. Audio index is http://injector:8091/atis/index.json
# on the compose network. Do not publish 8091 on the host unless you opt in.

name: opsaero-injector

services:
  injector:
    image: ghcr.io/jaycommit/openfsd-injector:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${OPENFSD_CONFIG:-./config.example.yaml}:/app/config.yaml:ro
      - ./audio:/app/audio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # network_mode: host
    # Opt-in host publish of the ATIS audio index (default is compose-network only):
    # ports:
    #   - "127.0.0.1:8091:8091"

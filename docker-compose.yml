# Same host as opsaero-main (FSD :6809, openfsd API :8010 on the host).
#
#   git clone https://github.com/JayCommit/openfsd-injector
#   cd openfsd-injector
#   docker compose up -d --build
#
# After the image is on GHCR:
#   docker compose pull
#   docker compose up -d
#
# Optional: copy config.example.yaml → config.yaml and edit stations.
# Do not copy opsaero-main/.env — injector env is docker.env in this repo.

name: opsaero-injector

services:
  injector:
    image: ghcr.io/jaycommit/openfsd-injector:latest
    build: .
    restart: unless-stopped
    env_file:
      - docker.env
    environment:
      OPENFSD_HOST: ${OPENFSD_HOST:-host.docker.internal}
      OPENFSD_PORT: ${OPENFSD_PORT:-6809}
      OPENFSD_API_BASE: ${OPENFSD_API_BASE:-http://host.docker.internal:8010}
      OPENFSD_CID: ${OPENFSD_CID:-1}
      OPENFSD_PASSWORD: ${OPENFSD_PASSWORD:-opsaeroadmin}
    volumes:
      - ${OPENFSD_CONFIG:-./config.example.yaml}:/app/config.yaml:ro
      - ./audio:/app/audio
    extra_hosts:
      - "host.docker.internal:host-gateway"
